changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: Fixed
      labels:
        - bug
        - fix
    - title: Added
      labels:
        - feature
        - enhancement
    - title: Changed
      labels:
        - changed
        - refactor
    - title: Documentation
      labels:
        - documentation
    - title: Other
      labels:
        - "*"
